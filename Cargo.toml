[package]
name = "wesnoth-engine"
version = "0.1.0"
edition = "2024"
default-run = "wesnoth-client"

[features]
android-client = ["embedded-resources"]
embedded-resources = []

[dependencies]
macroquad = "0.4.14"
mlua = { version = "0.10", features = ["lua54", "vendored"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Android development APKs are what we install during play-testing. Leaving
# them at Cargo's opt-level 0 makes Lua/Rust value conversion and pathfinding
# many times slower than the shipped game.
[profile.dev]
opt-level = 2

[profile.dev.package."*"]
opt-level = 2

[[bin]]
name = "wesnoth-console"
path = "src/main.rs"

[[bin]]
name = "wesnoth-client"
path = "src/bin/client.rs"

[[bin]]
name = "terrain-viewer"
path = "src/bin/terrain_viewer.rs"

[[bin]]
name = "wesnoth-android"
path = "src/bin/android.rs"
required-features = ["android-client"]

[package.metadata.android]
android_version = 35
target_sdk_version = 35
min_sdk_version = 26
build_targets = ["aarch64-linux-android"]
fullscreen = true

[package.metadata.android.activity_attributes]
"android:screenOrientation" = "landscape"

[[package.metadata.android.bin]]
name = "wesnoth-android"
package_name = "org.wesnoth.port"
label = "Wesnoth Port"
